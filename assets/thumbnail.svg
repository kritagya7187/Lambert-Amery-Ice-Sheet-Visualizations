<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lambert-Amery Ice Sheet Visualizations thumbnail</title>
  <desc id="desc">Dark blue scientific 3D ice sheet plot with contour shading and axes.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020d1d"/>
      <stop offset="100%" stop-color="#051b2d"/>
    </linearGradient>

    <linearGradient id="terrainGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff9ff"/>
      <stop offset="20%" stop-color="#bff1ff"/>
      <stop offset="38%" stop-color="#58d0f7"/>
      <stop offset="58%" stop-color="#17a3d8"/>
      <stop offset="76%" stop-color="#0b5ea8"/>
      <stop offset="100%" stop-color="#052d6b"/>
    </linearGradient>

    <linearGradient id="terrainGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff9ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#64d9ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#002b5e" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

